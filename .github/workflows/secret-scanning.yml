name: Seguridad de secretos

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    # Revisión programada independiente de los cambios enviados por PR.
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Secretos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Conserva el historial necesario para revisar secretos versionados.
          fetch-depth: 0

      - name: Buscar secretos versionados
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
