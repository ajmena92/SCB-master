name: Seguridad de secretos

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Revisión programada independiente de los cambios enviados por PR.
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Secretos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          # Conserva el historial necesario para revisar secretos versionados.
          fetch-depth: 0

      - name: Buscar secretos versionados
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
