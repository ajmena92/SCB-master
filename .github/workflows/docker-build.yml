name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Docker Compose
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate docker-compose.production.yml
        working-directory: web/ops
        run: |
          echo "🔍 Validando compose.production.yml..."
          docker compose --env-file .env.example -f compose.production.yml config --quiet
          echo "✅ Docker Compose syntax válido"
      
      - name: Validate docker-compose.local.yml stack
        working-directory: web/ops
        run: |
          echo "🔍 Validando compose.local.yml stack..."
          docker compose --env-file .env.example -f compose.production.yml -f compose.local.yml config --quiet
          echo "✅ Docker Compose stack válido"
      
      - name: Check for 'latest' tags in compose files
        working-directory: web/ops
        run: |
          echo "🔍 Buscando ':latest' tags..."
          if grep -r ':latest' compose*.yml; then
            echo "❌ Found ':latest' tags in compose files - use specific versions"
            exit 1
          fi
          echo "✅ No 'latest' tags found"
      
      - name: Validate .env.example schema
        working-directory: web
        run: |
          echo "🔍 Validando .env.example..."
          python3 scripts/validar_variables.py
          echo "✅ Environment variables schema válido"

  build-api:
    runs-on: ubuntu-latest
    name: Build API Image
    needs: validate
    permissions:
      contents: read
      packages: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: web
          file: web/ops/Dockerfile.api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Las atestaciones se publican con la imagen; nunca se escriben en Git.
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}

  build-frontend:
    runs-on: ubuntu-latest
    name: Build Frontend Image
    needs: validate
    permissions:
      contents: read
      packages: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: web
          file: web/ops/Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}

  build-migrations:
    runs-on: ubuntu-latest
    name: Build Migration Image
    needs: validate
    permissions:
      contents: read
      packages: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrations
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Migrations image
        uses: docker/build-push-action@v5
        with:
          context: web
          file: web/ops/Dockerfile.migracion
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}

  summary:
    runs-on: ubuntu-latest
    name: Build Summary
    needs: [build-api, build-frontend, build-migrations]
    if: always()
    steps:
      - name: Print build summary
        run: |
          echo "✅ Build Workflow Completed"
          echo ""
          echo "Images built:"
          echo "  - API: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api"
          echo "  - Frontend: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web"
          echo "  - Migrations: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrations"
