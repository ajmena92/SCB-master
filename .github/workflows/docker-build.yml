name: Build and Push Docker Images

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Docker Compose
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install configuration validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate Compose stacks
        working-directory: web/ops
        run: |
          docker compose --env-file .env.production.example -f compose.production.yml config --quiet
          docker compose --env-file .env.local.example -f compose.production.yml -f compose.local.yml config --quiet
          docker compose --env-file .env.production.example -f compose.production.yml -f compose.prod-deploy.yml config --quiet

      - name: Reject mutable image tags
        working-directory: web/ops
        run: |
          if grep -r ':latest' compose*.yml; then
            echo "No se permiten etiquetas :latest en Compose." >&2
            exit 1
          fi

      - name: Validate environment templates
        working-directory: web
        run: |
          python3 scripts/validar_variables.py --template local
          python3 scripts/validar_variables.py --template production

  build-runtime:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.name }} image
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            suffix: api
            dockerfile: web/ops/Dockerfile.api
          - name: migrations
            suffix: migrations
            dockerfile: web/ops/Dockerfile.migracion
          - name: import worker
            suffix: trabajador-importacion
            dockerfile: web/ops/Dockerfile.trabajador_importacion
          - name: import process
            suffix: importacion
            dockerfile: web/ops/Dockerfile.importacion
          - name: analytics
            suffix: analitica
            dockerfile: web/ops/Dockerfile.analitica
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.suffix }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: web
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}

  build-frontend:
    runs-on: ubuntu-latest
    name: Build frontend image
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: web
          file: web/ops/Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}

  summary:
    runs-on: ubuntu-latest
    name: Build summary
    needs: [build-runtime, build-frontend]
    if: always()
    steps:
      - name: Print build summary
        run: |
          echo "Docker image workflow completed."
          echo "Runtime: api, migrations, trabajador-importacion, importacion, analitica."
          echo "Frontend: web."
