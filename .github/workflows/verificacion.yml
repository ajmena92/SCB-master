name: Verificación

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ejecutar_medicion_memoria:
        description: "Ejecutar la puerta de memoria contra el stack de staging"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: web/frontend/.nvmrc
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos, análisis, formato y arquitectura
        run: npm run verificar

      - name: Ejecutar pruebas
        run: npm test

      - name: Construir aplicación
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/backend
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/requirements-desarrollo.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-desarrollo.txt

      - name: Verificar Ruff
        run: ruff check .

      - name: Verificar formato Python
        run: ruff format --check .

      - name: Verificar tipos Python
        run: mypy

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Medir cobertura backend
        run: >-
          pytest --cov=aplicacion --cov-report=term-missing
          --cov-report=json:coverage/coverage.json -q

      - name: Verificar cobertura de dominios críticos
        run: >-
          coverage report
          --include='aplicacion/modulos/identidad/seguridad.py,aplicacion/modulos/cuentas/servicio.py,aplicacion/modulos/asistencia/servicio.py'
          --fail-under=90

      - name: Conservar reporte de cobertura
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-backend-${{ github.run_id }}
          path: web/backend/coverage/coverage.json
          if-no-files-found: error

      - name: Verificar cliente TypeScript generado desde OpenAPI
        run: python ../scripts/generar_cliente_openapi.py --verificar

  e2e:
    name: Integración E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: scb_test
          POSTGRES_USER: scb_api
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U scb_api -d scb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: web/frontend/.nvmrc
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/requirements-desarrollo.txt

      - name: Instalar dependencias frontend
        working-directory: web/frontend
        run: npm ci

      - name: Instalar dependencias backend
        working-directory: web/backend
        run: python -m pip install -r requirements-desarrollo.txt

      - name: Aplicar migraciones
        working-directory: web/backend
        env:
          DATABASE_URL: postgresql+psycopg://scb_api:test_password@localhost:5432/scb_test
        run: alembic upgrade head

      - name: Iniciar API
        working-directory: web/backend
        env:
          DATABASE_URL: postgresql+psycopg://scb_api:test_password@localhost:5432/scb_test
          CORS_ORIGIN: http://127.0.0.1:3000
          APP_ENV: test
          COOKIE_SECURE: "false"
          CSRF_SECRET: test_secret_1234567890abcdef
          CARNET_QR_CLAVE: test_key
          IMPORTACION_RESULTADOS_KEY: test_key
          STUDENT_MAX_LOGIN_ATTEMPTS: "8"
          STUDENT_LOCK_MINUTES: "5"
          ADMIN_MAX_LOGIN_ATTEMPTS: "5"
          ADMIN_LOCK_MINUTES: "15"
          STUDENT_SESSION_DAYS: "365"
          ADMIN_SESSION_MINUTES: "60"
          CSRF_ANONYMOUS_TTL_SECONDS: "600"
        run: uvicorn aplicacion.entrada:crear_aplicacion --factory --host 127.0.0.1 --port 8000 &

      - name: Esperar API disponible
        run: |
          for intento in {1..30}; do
            curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/salud >/dev/null && exit 0
            sleep 1
          done
          echo "La API no inició correctamente." >&2
          exit 1

      - name: Verificar contrato de salud
        run: >-
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/salud |
          python -c "import json, sys; assert json.load(sys.stdin) == {'estado': 'ok', 'baseDatos': 'postgresql'}"

      - name: Construir frontend
        working-directory: web/frontend
        run: npm run build

      - name: Instalar navegador Playwright
        working-directory: web/frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        working-directory: web/frontend
        run: npm run test:e2e

      - name: Conservar reporte Playwright
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: web/frontend/playwright-report/
          if-no-files-found: ignore

  memoria-staging:
    name: Memoria de staging
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ejecutar_medicion_memoria == true }}
    runs-on: self-hosted
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Medir memoria de los servicios desplegados
        env:
          COMPOSE_ENV_FILE: ${{ vars.COMPOSE_ENV_FILE }}
          SALIDA_MEDICION_MEMORIA: /tmp/scsc-memoria-staging-${{ github.run_id }}.tsv
          SALIDA_MUESTRAS_MEMORIA: /tmp/scsc-memoria-staging-${{ github.run_id }}-muestras.tsv
          URL_PRUEBA: ${{ vars.URL_PRUEBA }}
          USUARIOS_PRUEBA: ${{ vars.USUARIOS_PRUEBA || 1 }}
          UMBRAL_MEMORIA_PORCENTAJE: ${{ vars.UMBRAL_MEMORIA_PORCENTAJE || 70 }}
          LATENCIA_P95_UMBRAL_MS: ${{ vars.LATENCIA_P95_UMBRAL_MS }}
          LATENCIA_P95_REFERENCIA_MS: ${{ vars.LATENCIA_P95_REFERENCIA_MS }}
          AUMENTO_LATENCIA_MAXIMO_PORCENTAJE: ${{ vars.AUMENTO_LATENCIA_MAXIMO_PORCENTAJE || 20 }}
          EXIGIR_UMBRAL_MEMORIA: "true"
          DURACION_MEDICION_SEGUNDOS: ${{ vars.DURACION_MEDICION_SEGUNDOS || 60 }}
          INTERVALO_MEDICION_SEGUNDOS: ${{ vars.INTERVALO_MEDICION_SEGUNDOS || 1 }}
        run: ./web/scripts/medir_memoria_operativa.sh

      - name: Conservar evidencia de memoria
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: medicion-memoria-${{ github.run_id }}
          path: |
            /tmp/scsc-memoria-staging-${{ github.run_id }}.tsv
            /tmp/scsc-memoria-staging-${{ github.run_id }}-muestras.tsv
          if-no-files-found: error
