name: Verificación

on:
  pull_request:
    paths:
      - ".github/workflows/verificacion.yml"
      - "web/backend/**"
      - "web/frontend/**"
      - "web/scripts/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/verificacion.yml"
      - "web/backend/**"
      - "web/frontend/**"
      - "web/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/frontend/.nvmrc
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos, análisis, formato y arquitectura
        run: npm run verificar

      - name: Ejecutar pruebas
        run: npm test

      - name: Construir aplicación
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/backend
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar Ruff
        run: ruff check .

      - name: Verificar formato Python
        run: ruff format --check .

      - name: Verificar tipos Python
        run: mypy

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Verificar cliente TypeScript generado desde OpenAPI
        run: python ../scripts/generar_cliente_openapi.py --verificar
