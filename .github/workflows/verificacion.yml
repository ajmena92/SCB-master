name: Verificación

on:
  pull_request:
    paths:
      - ".github/workflows/verificacion.yml"
      - "web/backend/**"
      - "web/frontend/**"
      - "web/ops/**"
      - "web/scripts/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/verificacion.yml"
      - "web/backend/**"
      - "web/frontend/**"
      - "web/ops/**"
      - "web/scripts/**"
  workflow_dispatch:
    inputs:
      ejecutar_medicion_memoria:
        description: "Ejecutar la puerta de memoria contra el stack de staging"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/frontend/.nvmrc
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos, análisis, formato y arquitectura
        run: npm run verificar

      - name: Ejecutar pruebas
        run: npm test

      - name: Construir aplicación
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/backend
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/requirements-desarrollo.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-desarrollo.txt

      - name: Verificar Ruff
        run: ruff check .

      - name: Verificar formato Python
        run: ruff format --check .

      - name: Verificar tipos Python
        run: mypy

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Medir cobertura backend
        run: >-
          pytest --cov=aplicacion --cov-report=term-missing
          --cov-report=json:coverage/coverage.json -q

      - name: Verificar cobertura de dominios críticos
        run: >-
          coverage report
          --include='aplicacion/modulos/identidad/seguridad.py,aplicacion/modulos/cuentas/servicio.py,aplicacion/modulos/asistencia/servicio.py'
          --fail-under=90

      - name: Conservar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend-${{ github.run_id }}
          path: web/backend/coverage/coverage.json
          if-no-files-found: error

      - name: Verificar cliente TypeScript generado desde OpenAPI
        run: python ../scripts/generar_cliente_openapi.py --verificar

  memoria-staging:
    name: Memoria de staging
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ejecutar_medicion_memoria == true }}
    runs-on: self-hosted
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Medir memoria de los servicios desplegados
        env:
          COMPOSE_ENV_FILE: ${{ vars.COMPOSE_ENV_FILE }}
          SALIDA_MEDICION_MEMORIA: /tmp/scsc-memoria-staging-${{ github.run_id }}.tsv
          SALIDA_MUESTRAS_MEMORIA: /tmp/scsc-memoria-staging-${{ github.run_id }}-muestras.tsv
          URL_PRUEBA: ${{ vars.URL_PRUEBA }}
          USUARIOS_PRUEBA: ${{ vars.USUARIOS_PRUEBA || 1 }}
          UMBRAL_MEMORIA_PORCENTAJE: ${{ vars.UMBRAL_MEMORIA_PORCENTAJE || 70 }}
          LATENCIA_P95_UMBRAL_MS: ${{ vars.LATENCIA_P95_UMBRAL_MS }}
          LATENCIA_P95_REFERENCIA_MS: ${{ vars.LATENCIA_P95_REFERENCIA_MS }}
          AUMENTO_LATENCIA_MAXIMO_PORCENTAJE: ${{ vars.AUMENTO_LATENCIA_MAXIMO_PORCENTAJE || 20 }}
          EXIGIR_UMBRAL_MEMORIA: "true"
          DURACION_MEDICION_SEGUNDOS: ${{ vars.DURACION_MEDICION_SEGUNDOS || 60 }}
          INTERVALO_MEDICION_SEGUNDOS: ${{ vars.INTERVALO_MEDICION_SEGUNDOS || 1 }}
        run: ./web/scripts/medir_memoria_operativa.sh

      - name: Conservar evidencia de memoria
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: medicion-memoria-${{ github.run_id }}
          path: |
            /tmp/scsc-memoria-staging-${{ github.run_id }}.tsv
            /tmp/scsc-memoria-staging-${{ github.run_id }}-muestras.tsv
          if-no-files-found: error
