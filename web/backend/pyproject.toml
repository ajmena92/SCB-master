[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "assets",
  "scripts/import_student_photos.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["aplicacion"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["aplicacion"]
check_untyped_defs = true
disallow_any_generics = false
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "silent"
