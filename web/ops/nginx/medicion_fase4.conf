# Solo ensayo local: certificado efímero montado por medir_http_fase4.py.
events {}
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    server {
        listen 127.0.0.1:55441 ssl;
        ssl_certificate /certificados/cert.pem;
        ssl_certificate_key /certificados/key.pem;
        client_max_body_size 13m;
        location /api/ {
            proxy_pass http://127.0.0.1:55440;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
