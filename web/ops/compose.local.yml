# Sobrescritura local. Debe combinarse después de compose.production.yml.
name: scb-web-local
volumes:
  postgres_datos:
    external: true
    name: scb-web_postgres_datos
services:
  postgres:
    restart: "no"
  migracion:
    command: ["upgrade", "head"]
    restart: "no"
  api:
    restart: "no"
  web:
    restart: "no"
