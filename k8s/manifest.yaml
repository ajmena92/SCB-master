---
apiVersion: v1
kind: Namespace
metadata:
  name: scb-portal
  labels:
    name: scb-portal
    environment: production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scb-config
  namespace: scb-portal
data:
  APP_ENV: "production"
  APP_TZ: "America/Costa_Rica"
  CORS_ORIGIN: "https://portal.ejemplo.edu.cr"
  COOKIE_SECURE: "true"
  CSRF_ANONYMOUS_TTL_SECONDS: "600"
  STUDENT_SESSION_DAYS: "365"
  ADMIN_SESSION_MINUTES: "60"
  STUDENT_MAX_LOGIN_ATTEMPTS: "8"
  STUDENT_LOCK_MINUTES: "5"
  ADMIN_MAX_LOGIN_ATTEMPTS: "5"
  ADMIN_LOCK_MINUTES: "15"
  UVICORN_WORKERS: "2"
  TRUSTED_PROXY_CIDRS: "10.0.0.0/8"
  FORWARDED_ALLOW_IPS: "*"

---
apiVersion: v1
kind: Secret
metadata:
  name: scb-secrets
  namespace: scb-portal
type: Opaque
stringData:
  postgres-admin-password: "CAMBIAR_EN_PRODUCCION"
  postgres-app-password: "CAMBIAR_EN_PRODUCCION"
  postgres-migrator-password: "CAMBIAR_EN_PRODUCCION"
  csrf-secret: "CAMBIAR_EN_PRODUCCION_SECRET_32_CHARS"
  carnet-qr-clave: "CAMBIAR_EN_PRODUCCION"
  importacion-resultados-key: "CAMBIAR_EN_PRODUCCION"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pvc
  namespace: scb-portal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-wal-archive-pvc
  namespace: scb-portal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: scb-portal
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      containers:
      - name: postgresql
        image: postgres:17.6-bookworm
        ports:
        - name: postgresql
          containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "scb"
        - name: POSTGRES_USER
          value: "scb_admin"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: scb-secrets
              key: postgres-admin-password
        - name: POSTGRES_INITDB_ARGS
          value: "--encoding=UTF8 --locale=C.UTF-8 --data-checksums"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        - name: POSTGRES_APP_USER
          value: "scb_api"
        - name: POSTGRES_MIGRATOR_USER
          value: "scb_migrador"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U scb_admin -d scb
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U scb_admin -d scb
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        volumeMounts:
        - name: postgresql-storage
          mountPath: /var/lib/postgresql/data
        - name: postgresql-wal-archive
          mountPath: /archivo_wal
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: postgresql-storage
        persistentVolumeClaim:
          claimName: postgresql-pvc
      - name: postgresql-wal-archive
        persistentVolumeClaim:
          claimName: postgresql-wal-archive-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: scb-portal
  labels:
    app: postgresql
spec:
  clusterIP: None
  selector:
    app: postgresql
  ports:
  - name: postgresql
    port: 5432
    targetPort: postgresql

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: scb-portal
  labels:
    app: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      serviceAccountName: scb-api
      containers:
      - name: api
        image: ghcr.io/repository/scb-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: POSTGRES_HOST
          value: "postgresql.scb-portal.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "scb"
        - name: POSTGRES_USER
          value: "scb_api"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: scb-secrets
              key: postgres-app-password
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: scb-config
              key: CORS_ORIGIN
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: scb-config
              key: APP_ENV
        - name: COOKIE_SECURE
          valueFrom:
            configMapKeyRef:
              name: scb-config
              key: COOKIE_SECURE
        - name: CSRF_SECRET
          valueFrom:
            secretKeyRef:
              name: scb-secrets
              key: csrf-secret
        - name: CARNET_QR_CLAVE
          valueFrom:
            secretKeyRef:
              name: scb-secrets
              key: carnet-qr-clave
        - name: IMPORTACION_RESULTADOS_KEY
          valueFrom:
            secretKeyRef:
              name: scb-secrets
              key: importacion-resultados-key
        - name: CSRF_ANONYMOUS_TTL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: scb-config
              key: CSRF_ANONYMOUS_TTL_SECONDS
        - name: STUDENT_SESSION_DAYS
          valueFrom:
            configMapKeyRef:
              name: scb-config
              key: STUDENT_SESSION_DAYS
        - name: ADMIN_SESSION_MINUTES
          valueFrom:
            configMapKeyRef:
              name: scb-config
              key: ADMIN_SESSION_MINUTES
        - name: TRUSTED_PROXY_CIDRS
          valueFrom:
            configMapKeyRef:
              name: scb-config
              key: TRUSTED_PROXY_CIDRS
        - name: FORWARDED_ALLOW_IPS
          valueFrom:
            configMapKeyRef:
              name: scb-config
              key: FORWARDED_ALLOW_IPS
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: scb-portal
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: scb-portal
  labels:
    app: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
      - name: web
        image: ghcr.io/repository/scb-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run
      volumes:
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: scb-portal
  labels:
    app: web
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
  - name: http
    port: 443
    targetPort: http
    protocol: TCP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scb-api
  namespace: scb-portal

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scb-api
  namespace: scb-portal
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scb-api
  namespace: scb-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scb-api
subjects:
- kind: ServiceAccount
  name: scb-api
  namespace: scb-portal

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scb-api-network-policy
  namespace: scb-portal
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: web
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgresql
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: scb-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
